version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: sezzle-calculator-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: sezzle-calculator-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend